[source]
; The archive-file url for a year is <url>/<year>.tar.gz
url = https://www.ncei.noaa.gov/data/global-summary-of-the-day/archive

[query]
; Year to download, 1929-2025
year = 1950
; Number of stations in the hottest and coldest lists
top = 5
; Min number of days of observations to be considered for aggregation
min_days = 300

[output]
; Temperature unit in the report: C or F or K
unit = C

[download]
; Set to true to enable caching of downloaded files,
; and to check the cache first before downloading a file
cache = false
; Directory for locally cached archives
cache_dir = ./cache
